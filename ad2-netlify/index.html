</style></head><body><div id="v"></div><nav id="n"></nav><script>
const EX=[["Développé couché","Pectoraux"],["Pompes","Pectoraux"],["Tractions","Dos"],["Rowing barre","Dos"],["Développé militaire","Épaules"],["Élévations latérales","Épaules"],["Curl barre","Biceps"],["Extension triceps","Triceps"],["Squat","Quadriceps"],["Presse","Quadriceps"],["Soulevé de terre roumain","Ischio-jambiers"],["Hip thrust","Fessiers"],["Mollets debout","Mollets"],["Crunch","Abdominaux"],["Gainage","Abdominaux"]];
let S={p:null,r:[],s:[],a:null,e:[],w:[],set:{end:0,rest:90}},T=0,CM=new Date(),CD=null,RV=null,NR=null;
const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dbp=new Promise(r=>{try{const q=indexedDB.open('ad2',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function save(){try{const d=await dbp;if(d)d.transaction('k','readwrite').objectStore('k').put(JSON.stringify(S),'s')}catch(e){}}
async function load(){const d=await dbp;if(!d)return;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
const all=()=>EX.concat(S.e),grp=n=>(all().find(e=>e[0]==n)||[0,'—'])[1];
const e1=(k,r)=>r>0?k*(1+r/30):0,vol=s=>s.filter(x=>x.d&&x.t!='W').reduce((a,x)=>a+x.k*x.r,0);
const fm=ms=>{ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')},fd=t=>new Date(t).toLocaleDateString('fr-FR');
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function stat(L){let v=0,se=0,re=0,du=0,gr={},ex={};L.forEach(s=>{du+=s.dur;s.x.forEach(x=>{const ss=x.s.filter(y=>y.d&&y.t!='W');se+=ss.length;ss.forEach(y=>{re+=y.r;v+=y.k*y.r});if(ss.length){gr[grp(x.n)]=(gr[grp(x.n)]||0)+ss.length;ex[x.n]=(ex[x.n]||0)+1}})});return{n:L.length,v,se,re,du,gr,ex}}
function best(n,before){let b=0;S.s.forEach(s=>{if(s.t0<before)s.x.filter(x=>x.n==n).forEach(x=>x.s.filter(y=>y.d&&y.t!='W').forEach(y=>b=Math.max(b,e1(y.k,y.r))))});return b}
function last(n){for(let i=S.s.length-1;i>=0;i--){const x=S.s[i].x.find(x=>x.n==n&&x.s.some(y=>y.d&&y.t!='W'));if(x)return x.s.filter(y=>y.d&&y.t!='W').map(sd).join(', ')}return'—'}
function pr(s){const o=[];s.x.forEach(x=>{const m=Math.max(0,...x.s.filter(y=>y.d&&y.t!='W').map(y=>e1(y.k,y.r)));if(m>0&&m>best(x.n,s.t0))o.push(x.n+' · 1RM ≈ '+m.toFixed(1)+' kg')});return o}
function periods(kind){const o=[],now=new Date();if(kind=='w'){let e=new Date(now);e.setHours(23,59,59,999);while(e.getDay()!=S.set.end)e.setDate(e.getDate()-1);if(e>now)e.setDate(e.getDate()-7);for(let i=0;i<8;i++){const st=new Date(e);st.setDate(st.getDate()-7);st.setHours(0,0,0,0);st.setDate(st.getDate()+1);o.push([+st,+e,fd(st)+' → '+fd(e)]);e=new Date(e);e.setDate(e.getDate()-7)}}else for(let i=0;i<6;i++){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,0,23,59,59,999);o.push([+a,+b,a.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})])}return o}
const inP=p=>S.s.filter(s=>s.t0>=p[0]&&s.t0<=p[1]);
function cmp(a,b){if(!b)return'';const d=a-b;return b?(d>=0?'+':'')+Math.round(d)+' ('+(d>=0?'+':'')+Math.round(d/b*100)+' %)':'—'}
function card(p,q){const a=stat(inP(p)),b=q?stat(inP(q)):null;const gs=Object.entries(a.gr).sort((x,y)=>y[1]-x[1]).map(e=>e[0]+' ('+e[1]+')').join(', ')||'—',es=Object.entries(a.ex).sort((x,y)=>y[1]-x[1]).slice(0,3).map(e=>e[0]).join(', ')||'—';
const pw=inP(p).reduce((n,s)=>n+pr(s).length,0);
return`<div class=c><b>${p[2]}</b><div class=s>${a.n} séance(s) · ${fm(a.du*1000)} · ${Math.round(a.v)} kg de volume · ${a.se} séries · ${a.re} reps · ${pw} record(s)</div>${b?`<div class=s>vs précédent : séances ${cmp(a.n,b.n)} · volume ${cmp(a.v,b.v)}</div>`:''}<div class=s>Muscles (séries, estimation) : ${gs}</div><div class=s>Exercices fréquents : ${es}</div></div>`}
function nav(){$('n').innerHTML=['Séances','Récap','Libre','Calendrier','Profil'].map((t,i)=>`<button class="${T==i?'on':''}" onclick="T=${i};go()">${t}</button>`).join('')}
function go(){nav();const v=$('v');if(!S.p){onb();return}if(S.a&&T!=1&&T!=3&&T!=4){act();return}v.innerHTML=[ses,rec,lib,cal,prof][T]();}
function onb(){$('v').innerHTML=`<img src="logo.png" alt="" width=88 height=88 style="display:block;border-radius:20px;margin:6px 0 10px"><h1>AD 2.0</h1><p class=s>TRAIN. TRACK. PROGRESS.</p><div class=c><input id=a placeholder=Prénom><br><br><input id=b placeholder=Nom><br><br><input id=c type=number placeholder="Poids (kg)"><br><br><input id=d type=number placeholder="Taille (cm)"><br><br><input id=f list=ol placeholder="Objectif (choisir ou saisir)"><datalist id=ol>${OBJ.map(o=>`<option value="${o}">`).join('')}</datalist><br><br><button class=p onclick=okp()>Commencer</button></div><p class=s>Données stockées uniquement sur cet appareil.</p>`}

function svr(){const n=(NR.n||'').trim();if(!n)return alert('Donnez un nom à la routine.');if(!NR.x.length)return alert('Ajoutez au moins un exercice.');const i=NR.i;delete NR.i;NR.n=n;i>=0?S.r[i]=NR:S.r.push(NR);NR=null;prune();save();go()}

function obs(n){OB.st=n;OB.q=0;scrollTo(0,0);onb()}
function obwh(id,from,to,val,fmt){let h='';for(let i=from;i<=to;i++)h+=`<div class="owi${i==val?' on':''}">${fmt?fmt(i):i}</div>`;return`<div class="ow" id="${id}">${h}</div>`}
function obwi(id,from,val,fn){const e=$(id);if(!e)return;const it=e.children;let last=val-from;e.scrollTop=last*40;e.onscroll=()=>{const i=Math.max(0,Math.min(it.length-1,Math.round(e.scrollTop/40)));if(i!=last){if(it[last])it[last].classList.remove('on');it[i].classList.add('on');last=i;fn(from+i)}};e.onclick=ev=>{const k=Array.prototype.indexOf.call(it,ev.target);if(k>=0)e.scrollTo({top:k*40,behavior:'smooth'})}}
function obn1(){if(!OB.a.trim()){const e=$('oa');if(e)e.focus();return}obs(2)}
function obp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);OB.av=c.toDataURL('image/jpeg',.8);OB.q=1;onb()};im.onerror=()=>alert('Image illisible');im.src=r.result};r.readAsDataURL(f)}
function obk(k){OB.o=OBJ[k];const e=$('oo');if(e)e.value=OB.o;document.querySelectorAll('.obb .tag').forEach((t,i)=>t.classList.toggle('on',i==k))}

onb=function(){ed(true);const s=OB.st,v=$('v'),bar=s>=1&&s<=4?`<div class="obt">${s>1?`<button onclick="obs(${s-1})" aria-label="Retour">${OBI('M15 5l-7 7 7 7',22)}</button>`:'<span class="sp"></span>'}<div class="obd">${[1,2,3,4].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><span class="sp"></span></div>`:'<div class="obt"></div>';let b='',f='';
if(s==0){b=`<div class="obz"><div class="oblg"><i></i><i></i><img src="logo.png" alt="AD 2.0"></div><div class="obv">Bienvenue sur</div><div class="oba">AD 2.0</div><div class="obg">TRAIN. TRACK. PROGRESS.</div></div>`;f=`<div class="obf obc"><button class="p" onclick="obs(1)">Configurer l'app</button></div><div class="obn">Données stockées uniquement sur cet appareil.</div>`}
else if(s==1){b=`<h1 class="obh">Quel est ton nom et ton prénom ?</h1><p class="obs">Pour personnaliser ton profil.</p><input id="oa" class="obi" placeholder="Prénom" autocomplete="given-name" enterkeyhint="next" value="${esc(OB.a)}" oninput="OB.a=this.value" onkeydown="if(event.key=='Enter'){event.preventDefault();$('ob2').focus()}"><input id="ob2" class="obi" style="margin-top:12px" placeholder="Nom" autocomplete="family-name" enterkeyhint="done" value="${esc(OB.b)}" oninput="OB.b=this.value" onkeydown="if(event.key=='Enter'){event.preventDefault();obn1()}">`;f=`<div class="obf"><button class="p" onclick="obn1()">Continuer</button></div>`}
else if(s==2){b=`<h1 class="obh" style="text-align:center">Ajoute une photo de profil</h1><p class="obs" style="text-align:center">Facultatif — tu pourras la changer plus tard.</p><label class="obav${OB.av?' has':''}">${OB.av?`<img src="${OB.av}" alt="">`:OBI('M4 7h3l2-3h6l2 3h3v13H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z',54)}<input type="file" accept="image/*" style="display:none" onchange="obp(this)"></label>`;f=`<div class="obf"><button class="p" ${OB.av?'':'disabled'} onclick="obs(3)">Continuer</button><button class="gh" onclick="OB.av='';obs(3)">Passer</button></div>`}
else if(s==3){b=`<h1 class="obh" style="text-align:center">Ton poids et ta taille</h1><p class="obs" style="text-align:center">Fais défiler pour choisir.</p><div class="owl"><span>POIDS (KG)</span><span>TAILLE (CM)</span></div><div class="obw">${obwh('owa',30,250,OB.wi)}${obwh('owb',0,9,OB.wd,i=>','+i)}${obwh('owc',100,230,OB.h)}</div>`;f=`<div class="obf"><button class="p" onclick="obs(4)">Continuer</button></div>`}
else if(s==4){b=`<h1 class="obh">Quel est ton objectif ?</h1><p class="obs">Écris le tien ou choisis une suggestion.</p><input id="oo" class="obi" placeholder="Ex. : prendre 5 kg de muscle" enterkeyhint="done" value="${esc(OB.o)}" oninput="OB.o=this.value;document.querySelectorAll('.obb .tag').forEach(t=>t.classList.remove('on'))" onkeydown="if(event.key=='Enter'){event.preventDefault();obf()}"><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:8px">${OBJ.map((o,k)=>`<span class="tag${OB.o==o?' on':''}" onclick="obk(${k})">${o}</span>`).join('')}</div>`;f=`<div class="obf"><button class="p" onclick="obf()">Enregistrer</button><button class="gh" onclick="obf(1)">Passer</button></div>`}
else{b=`<div class="obz"><div class="obok"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#09090B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1 class="obh">Tout est prêt${OB.a.trim()?', '+esc(OB.a.trim()):''} !</h1><p class="obs" style="margin:0">Bon entraînement 💪</p></div>`}
let o=document.getElementById('obx');if(!o){o=document.createElement('div');o.id='obx';document.body.appendChild(o)}v.innerHTML='';o.innerHTML=`<div class="ob">${bar}${s==0||s==5?b:`<div class="obb${OB.q?' q':''}">${b}</div>`}${f}</div>`;OB.q=0;
if(s==3){obwi('owa',30,OB.wi,x=>OB.wi=x);obwi('owb',0,OB.wd,x=>OB.wd=x);obwi('owc',100,OB.h,x=>OB.h=x)}};
